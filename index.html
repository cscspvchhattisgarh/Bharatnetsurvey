<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Point & FTTH Survey Portal</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; padding: 20px; margin: 0; }
        .container { max-width: 650px; background: white; margin: 0 auto; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 10px; }
        .form-group { margin-bottom: 18px; }
        label { font-weight: bold; display: block; margin-bottom: 6px; color: #34495e; }
        select, input[type="text"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        .card { background: #eef7fc; border-left: 5px solid #3498db; padding: 15px; margin-top: 15px; border-radius: 4px; }
        .question-box { background: #fff; padding: 10px; margin-bottom: 10px; border: 1px solid #e0e0e0; border-radius: 5px; }
        .btn-submit { width: 100%; background: #27ae60; color: white; border: none; padding: 12px; font-size: 16px; font-weight: bold; border-radius: 5px; cursor: pointer; margin-top: 15px; }
        .btn-submit:hover { background: #219150; }
        .btn-submit:disabled { background: #95a5a6; cursor: not-allowed; }
        .alert { padding: 10px; background-color: #f8d7da; color: #721c24; border-radius: 5px; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Access Point & FTTH Survey</h2>

    <div class="form-group">
        <label>1. District (ज़िला)</label>
        <select id="districtSelect" onchange="onDistrictChange()">
            <option value="">-- District चुनें --</option>
        </select>
    </div>

    <div class="form-group">
        <label>2. Block (ब्लॉक)</label>
        <select id="blockSelect" onchange="onBlockChange()" disabled>
            <option value="">-- Block चुनें --</option>
        </select>
    </div>

    <div class="form-group">
        <label>3. Gram Panchayat (ग्राम पंचायत)</label>
        <select id="gpSelect" onchange="onGPChange()" disabled>
            <option value="">-- Gram Panchayat चुनें --</option>
        </select>
    </div>

    <div id="surveyContainer"></div>

    <button id="submitBtn" class="btn-submit" onclick="submitSurvey()" style="display:none;">Survey Submit करें</button>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwc5KWLKVvdBgXYMfWox8Wc2EsOwKNGEWZ5vj7ZnvPNg0Iepyr0VqaFZx-wUGGG5sDO/exec";

    let dbData = [];
    let selectedGPData = null;

    function isBlankSubscriber(sub) {
        const org = sub && sub.org ? String(sub.org).trim().toUpperCase() : '';
        const id = sub && sub.id ? String(sub.id).trim().toUpperCase() : '';
        return org === 'BLANK' && id === 'BLANK';
    }

    window.onload = function() {
        loadSurveyData();
    };

    function loadSurveyData() {
        fetch(SCRIPT_URL)
            .then(res => {
                if (!res.ok) {
                    throw new Error('Failed to fetch survey data');
                }
                return res.json();
            })
            .then(data => {
                dbData = Array.isArray(data) ? data : [];
                populateDistricts();
            })
            .catch(err => {
                console.error(err);
                alert("डेटा लोड करने में समस्या आई। कृपया बाद में पुनः प्रयास करें।");
            });
    }

    function populateDistricts() {
        const distSelect = document.getElementById('districtSelect');
        distSelect.innerHTML = '<option value="">-- District चुनें --</option>';

        const districts = [...new Set(dbData.map(item => item && item.district).filter(Boolean))].sort();
        districts.forEach(d => {
            let opt = document.createElement('option');
            opt.value = d;
            opt.innerText = d;
            distSelect.appendChild(opt);
        });
    }

    function onDistrictChange() {
        const dist = document.getElementById('districtSelect').value;
        const blockSelect = document.getElementById('blockSelect');
        const gpSelect = document.getElementById('gpSelect');

        blockSelect.innerHTML = '<option value="">-- Block चुनें --</option>';
        gpSelect.innerHTML = '<option value="">-- Gram Panchayat चुनें --</option>';
        gpSelect.disabled = true;
        document.getElementById('surveyContainer').innerHTML = '';
        document.getElementById('submitBtn').style.display = 'none';
        document.getElementById('submitBtn').disabled = false;

        if (!dist) {
            blockSelect.disabled = true;
            return;
        }

        const blocks = [...new Set(dbData.filter(x => x && x.district === dist).map(x => x.block).filter(Boolean))].sort();
        blocks.forEach(b => {
            let opt = document.createElement('option');
            opt.value = b;
            opt.innerText = b;
            blockSelect.appendChild(opt);
        });
        blockSelect.disabled = false;
    }

    function onBlockChange() {
        const dist = document.getElementById('districtSelect').value;
        const block = document.getElementById('blockSelect').value;
        const gpSelect = document.getElementById('gpSelect');

        gpSelect.innerHTML = '<option value="">-- Gram Panchayat चुनें --</option>';
        document.getElementById('surveyContainer').innerHTML = '';
        document.getElementById('submitBtn').style.display = 'none';
        document.getElementById('submitBtn').disabled = false;

        if (!block) {
            gpSelect.disabled = true;
            return;
        }

        const gps = dbData.filter(x => x && x.district === dist && x.block === block);
        gps.forEach(g => {
            let opt = document.createElement('option');
            opt.value = g.gpCode;
            opt.innerText = g.gpName;
            gpSelect.appendChild(opt);
        });
        gpSelect.disabled = false;
    }

    function onGPChange() {
        const gpCode = document.getElementById('gpSelect').value;
        const container = document.getElementById('surveyContainer');
        const submitBtn = document.getElementById('submitBtn');

        container.innerHTML = '';
        submitBtn.style.display = 'none';
        submitBtn.disabled = false;

        if (!gpCode) return;

        selectedGPData = dbData.find(x => x && x.gpCode == gpCode) || null;
        if (!selectedGPData) {
            container.innerHTML = '<div class="alert">⚠️ चयनित ग्राम पंचायत डेटा उपलब्ध नहीं है।</div>';
            return;
        }

        let hasActiveSurvey = false;

        const apInstalled = selectedGPData.apStatus && String(selectedGPData.apStatus).trim().toUpperCase() === 'INSTALLED';
        if (apInstalled) {
            hasActiveSurvey = true;
            let apHtml = `
                <div class="card">
                    <h3>📡 Access Point Survey</h3>
                    <div class="question-box">
                        <label>1. Access Point - Pole Installed?</label>
                        <select id="ap_pole"><option value="YES">YES</option><option value="NO">NO</option></select>
                    </div>
                    <div class="question-box">
                        <label>2. Access Point Installed?</label>
                        <select id="ap_inst"><option value="YES">YES</option><option value="NO">NO</option></select>
                    </div>
                    <div class="question-box">
                        <label>3. Solar Installed?</label>
                        <select id="solar_inst"><option value="YES">YES</option><option value="NO">NO</option></select>
                    </div>
                    <div class="question-box">
                        <label>4. CCU Installed?</label>
                        <select id="ccu_inst"><option value="YES">YES</option><option value="NO">NO</option></select>
                    </div>
                    <div class="question-box">
                        <label>5. Battery Installed?</label>
                        <select id="bat_inst"><option value="YES">YES</option><option value="NO">NO</option></select>
                    </div>
                </div>`;
            container.innerHTML += apHtml;
        } else {
            container.innerHTML += '<div class="alert">⚠️ Access Point status "NOT INSTALLED" है, इसका सर्वे नहीं होगा।</div>';
        }

        const ftthInstalled = selectedGPData.ftthStatus && String(selectedGPData.ftthStatus).trim().toUpperCase() === 'INSTALLED';
        const visibleSubscribers = Array.isArray(selectedGPData.subscribers)
            ? selectedGPData.subscribers.filter(sub => !isBlankSubscriber(sub))
            : [];

        if (ftthInstalled && visibleSubscribers.length > 0) {
            hasActiveSurvey = true;
            let ftthHtml = `<div class="card"><h3>🔌 FTTH Survey (Subscribers)</h3>`;
            visibleSubscribers.forEach((sub, idx) => {
                ftthHtml += `
                    <div class="question-box">
                        <p><strong>Organisation:</strong> ${sub && sub.org ? sub.org : '-'} | <strong>ID:</strong> ${sub && sub.id ? sub.id : '-'}</p>
                        <label>Router Installed?</label>
                        <select id="ftth_router_${idx}">
                            <option value="YES">YES</option>
                            <option value="NO">NO</option>
                        </select>
                    </div>`;
            });
            ftthHtml += `</div>`;
            container.innerHTML += ftthHtml;
        } else if (ftthInstalled && visibleSubscribers.length === 0) {
            container.innerHTML += '<div class="alert">⚠️ FTTH status "INSTALLED" है, लेकिन Subscriber डेटा उपलब्ध नहीं है।</div>';
        } else {
            container.innerHTML += '<div class="alert">⚠️ FTTH status "NOT INSTALLED" है या कोई Subscriber मौजूद नहीं है।</div>';
        }

        if (hasActiveSurvey) {
            submitBtn.style.display = 'block';
        }
    }

    function submitSurvey() {
        if (!selectedGPData) {
            alert("कृपया पहले ग्राम पंचायत चुनें।");
            return;
        }

        let records = [];

        const apInstalled = selectedGPData.apStatus && String(selectedGPData.apStatus).trim().toUpperCase() === 'INSTALLED';
        if (apInstalled) {
            records.push({
                district: selectedGPData.district,
                block: selectedGPData.block,
                gpName: selectedGPData.gpName,
                surveyType: "AP",
                apPole: document.getElementById('ap_pole').value,
                apInstalled: document.getElementById('ap_inst').value,
                solarInstalled: document.getElementById('solar_inst').value,
                ccuInstalled: document.getElementById('ccu_inst').value,
                batteryInstalled: document.getElementById('bat_inst').value
            });
        }

        const ftthInstalled = selectedGPData.ftthStatus && String(selectedGPData.ftthStatus).trim().toUpperCase() === 'INSTALLED';
        if (ftthInstalled && Array.isArray(selectedGPData.subscribers)) {
            const visibleSubscribers = selectedGPData.subscribers.filter(sub => !isBlankSubscriber(sub));
            visibleSubscribers.forEach((sub, idx) => {
                const routerEl = document.getElementById(`ftth_router_${idx}`);
                records.push({
                    district: selectedGPData.district,
                    block: selectedGPData.block,
                    gpName: selectedGPData.gpName,
                    surveyType: "FTTH",
                    subId: sub && sub.id ? sub.id : '',
                    org: sub && sub.org ? sub.org : '',
                    routerInstalled: routerEl ? routerEl.value : 'NO'
                });
            });
        }

        if (records.length === 0) {
            alert("इस ग्राम पंचायत के लिए कोई सक्रिय सर्वे उपलब्ध नहीं है।");
            return;
        }

        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.innerText = 'सहेज रहा है...';

        fetch(SCRIPT_URL, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ records: records })
        })
        .then(async res => {
            const contentType = res.headers.get('content-type') || '';
            let responseData = null;

            if (contentType.includes('application/json')) {
                responseData = await res.json();
            } else {
                responseData = await res.text();
            }

            console.log('Submit response:', responseData);
            return responseData;
        })
        .then(response => {
            const successMessage = (response && response.message) ? response.message : "Survey सफलतापूर्वक जमा हो गया है!";
            alert(successMessage);
            location.reload();
        })
        .catch(err => {
            console.error(err);
            alert("Error: Survey submit failed. Please try again.");
            submitBtn.disabled = false;
            submitBtn.innerText = 'Survey Submit करें';
        });
    }
</script>

</body>
</html>
